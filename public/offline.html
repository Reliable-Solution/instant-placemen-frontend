<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline | Instant Placement</title>
  <meta name="theme-color" content="#2563eb" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
    }
    .logo-container {
      width: 64px;
      height: 64px;
      border-radius: 1rem;
      background: #eff6ff;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      border-radius: 0.875rem;
      cursor: pointer;
      transition: background 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/icons/icon-192x192.png" alt="Instant Placement Logo" />
    </div>
    <div class="badge">
      <span class="dot"></span>
      <span>No Internet Connection</span>
    </div>
    <h1>You're currently offline</h1>
    <p>
      Please check your network connection or Wi-Fi settings. Previously visited pages will load automatically once you're back online.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
  <script>
    // Automatically reload when network returns
    window.addEventListener("online", () => {
      window.location.reload();
    });
  </script>
</body>
</html>
